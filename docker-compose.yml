

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis123
      POSTGRES_DB: jarvis
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jarvis']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: always
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql+asyncpg://jarvis:jarvis123@db:5432/jarvis
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
